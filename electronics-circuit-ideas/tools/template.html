<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>電子點子庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 工作台筆記本：淡灰綠方格紙底，焊錫銅色當唯一強調色，數字與頁碼用等寬字 */
:root{
  --bg:#edf0ec; --panel:#f7f9f6; --fg:#1d2a26; --muted:#5d6b66; --line:#cdd5cf; --accent:#a9501c; --accent-ink:#ffffff; --chip:#dfe6e1; --grid:#dde3de;
  --f-body:"Noto Sans TC",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201c;--panel:#1b2a25;--fg:#e4ece7;--muted:#97a8a0;--line:#2f423b;--accent:#e58a52;--accent-ink:#1a1210;--chip:#243630;--grid:#1a2823;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201c;--panel:#1b2a25;--fg:#e4ece7;--muted:#97a8a0;--line:#2f423b;--accent:#e58a52;--accent-ink:#1a1210;--chip:#243630;--grid:#1a2823;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--f-body);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;padding-inline:clamp(16px,4vw,48px);padding-block:28px 64px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(26px,5vw,38px);margin:0;line-height:1.2;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.count{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 220px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px}
select{font:inherit;padding:9px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:4px}
button.chip{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;cursor:pointer}
button.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:16px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.tag{padding:1px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.tag.p{border-color:var(--accent);color:var(--accent)}
.src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card p{margin:0;font-size:14px}
.idea{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.idea b{color:var(--accent);font-weight:500}
.star{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:0 2px}
.star[aria-pressed=true]{color:var(--accent)}
.top{display:flex;gap:8px;align-items:flex-start}
.empty{padding:40px 0;color:var(--muted)}
footer{margin-top:36px;color:var(--muted);font-size:13px;max-width:70ch}
.b{padding:1px 8px;border-radius:3px;font-size:12px;border:1px solid var(--line)}
.b.ok{border-color:#2f8f5b;color:#2f8f5b}.b.mid{border-color:#b7861f;color:#b7861f}.b.hard{border-color:#b23a3a;color:#b23a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b.ok{color:#6fd39a;border-color:#6fd39a}:root:not([data-theme="light"]) .b.mid{color:#e6b84f;border-color:#e6b84f}:root:not([data-theme="light"]) .b.hard{color:#ef8a8a;border-color:#ef8a8a}}
details{font-size:13px}summary{cursor:pointer;color:var(--accent)}
pre{margin:8px 0 0;padding:10px;overflow:auto;max-height:260px;background:var(--bg);border:1px solid var(--line);font:12px/1.5 var(--f-mono)}
.res{color:var(--fg);font-size:13px}
.note{font-size:13px;color:var(--muted)}

.card{cursor:pointer;transition:border-color .12s}.card:hover{border-color:var(--accent)}
.more{align-self:flex-start;font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
dialog{width:min(920px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(10,18,15,.6)}
.dh{display:flex;gap:10px;align-items:flex-start;padding:14px 18px 0}
.dh h2{margin:0;font-size:20px;line-height:1.35;flex:1}
.x{font:inherit;font-size:22px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px}
.tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{font:inherit;font-size:14px;padding:7px 14px;border:1px solid transparent;border-bottom:0;background:none;color:var(--muted);cursor:pointer;border-radius:4px 4px 0 0;margin-bottom:-1px}
.tab[aria-selected=true]{background:var(--panel);border-color:var(--line);color:var(--fg);box-shadow:inset 0 2px 0 var(--accent)}
.db{padding:16px 18px 20px;overflow:auto;display:grid;gap:14px;align-content:start}
.db .note{margin:0}
.cg{width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.cg .w{stroke:var(--muted);stroke-width:1.3;fill:none}.cg .dz{stroke-dasharray:4 3;opacity:.7}
.cg .nd{fill:var(--muted)}.cg .nn{font:10px var(--f-mono);fill:var(--muted)}.cg .pn{font:bold 10px var(--f-mono);fill:var(--accent)}
.cg .el rect{fill:var(--panel);stroke:var(--fg);stroke-width:1}
.cg .el text{text-anchor:middle;font:11px var(--f-mono);fill:var(--fg)}.cg .el .t2{fill:var(--muted);font-size:10px}
.cg .kQ rect,.cg .kJ rect{stroke:var(--accent);stroke-width:1.8}.cg .kV rect,.cg .kI rect{stroke-dasharray:3 2}.cg .kX rect,.cg .kB rect,.cg .kE rect{fill:var(--chip)}
.chart{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 6px 6px}
.chart h4{margin:2px 10px 0;font-size:14px}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .ax{stroke:var(--line);stroke-width:1}.chart .gd{stroke:var(--line);stroke-width:1;opacity:.6}
.chart text{font:13px var(--f-mono);fill:var(--muted)}
.chart .ln{fill:none;stroke-width:1.6;stroke-linejoin:round}
.chart .rd{font:12px var(--f-mono);color:var(--muted);margin:2px 10px 0;min-height:1.4em}
.lg{display:flex;gap:14px;margin:2px 10px 0;font-size:12px;flex-wrap:wrap}.lg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.cap{font-size:12px;color:var(--muted)}
@media (max-width:560px){.tab{padding:7px 10px;font-size:13px}.dh h2{font-size:18px}}
.schbox{overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;color:var(--fg)}.sch{height:auto;display:block}.sch text{fill:currentColor}
</style>
</head><body>
<div class="wrap">
<header>
 <div><h1>電子點子庫</h1><p class="sub">整理自《The ARRL Handbook for Radio Communications 2011》的專案與電路積木，附 SPICE 可行性、台灣取得難度與已驗證的 netlist。</p></div>
 <div class="count" id="count"></div>
</header>
<div class="bar">
 <div class="row"><input type="search" id="q" placeholder="搜尋：LM317、VFO、濾波、keyer…" aria-label="搜尋">
 <select id="lv" aria-label="難度"><option value="">難度不限</option><option>入門</option><option>中階</option><option>進階</option></select>
 <select id="tp" aria-label="類型"><option value="">專案＋積木</option><option value="專案">完整專案</option><option value="積木">電路積木</option></select>
 <select id="sp" aria-label="SPICE"><option value="">SPICE 不限</option><option>可</option><option>部分</option><option>難</option></select>
 <select id="tw" aria-label="取得難度"><option value="">取得難度不限</option><option>易</option><option>中</option><option>難</option></select>
 <button class="chip" id="nl" aria-pressed="false">有 netlist</button><button class="chip" id="fav" aria-pressed="false">只看收藏</button></div>
 <div class="row" id="cats"></div>
</div>
<div class="grid" id="grid"></div>
<footer>書中圖片受著作權保護，未放入此 repo；每筆以章節、PDF 頁碼與圖號指向原書。「SPICE」「台灣取得」兩欄與難度為我依內容和經驗所做的估計，沒有逐項查現貨。標示「已驗證」的 netlist 都在 ngspice 42 跑過，結果寫在卡片上，元件值若不是取自書中圖，卡片會註明。</footer>
</div>
<dialog id="dlg" aria-labelledby="dt"><div class="dh"><h2 id="dt"></h2><button class="x" id="dx" aria-label="關閉">×</button></div><div class="tabs" id="tabs" role="tablist"></div><div class="db" id="db"></div></dialog>
<script>
const D=__DATA__;
const cats=[...new Set(D.map(x=>x.category))];
let cat='',favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem('eci-favs')||'[]'))}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const cls={'可':'ok','易':'ok','部分':'mid','中':'mid','難':'hard'};
function save(){try{localStorage.setItem('eci-favs',JSON.stringify([...favs]))}catch(e){}}
function chips(){const el=$('cats');el.innerHTML='';['全部',...cats].forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.setAttribute('aria-pressed',String((c==='全部'&&!cat)||c===cat));b.onclick=()=>{cat=c==='全部'?'':c;chips();render()};el.appendChild(b)})}
function pressed(id){return $(id).getAttribute('aria-pressed')==='true'}
function render(){
 const q=$('q').value.trim().toLowerCase(),lv=$('lv').value,tp=$('tp').value,sp=$('sp').value,tw=$('tw').value;
 const L=D.filter(x=>(!cat||x.category===cat)&&(!lv||x.level===lv)&&(!tp||x.type===tp)&&(!sp||x.spice===sp)&&(!tw||x.tw_sourcing===tw)&&(!pressed('nl')||x.netlist)&&(!pressed('fav')||favs.has(x.id))&&(!q||(x.name+x.description+x.idea+x.category+x.figures+x.note).toLowerCase().includes(q)));
 $('count').textContent=L.length+' / '+D.length+' 筆';
 const g=$('grid');
 if(!L.length){g.innerHTML='<div class="empty">沒有符合的項目，換個關鍵字或放寬篩選。</div>';return}
 g.innerHTML=L.map(x=>`<article class="card" data-open="${x.id}"><div class="top"><h3>${esc(x.name)}</h3><button class="star" data-id="${x.id}" aria-pressed="${favs.has(x.id)}" aria-label="收藏">${favs.has(x.id)?'★':'☆'}</button></div>
<div class="meta"><span class="tag ${x.type==='專案'?'p':''}">${x.type}</span><span class="tag">${x.category}</span><span class="tag">${x.level}</span><span class="b ${cls[x.spice]}">SPICE ${x.spice}</span><span class="b ${cls[x.tw_sourcing]}">取得 ${x.tw_sourcing}</span></div>
<p>${esc(x.description)}</p>${x.note?`<div class="note">${esc(x.note)}</div>`:''}
<div class="src">第 ${x.chapter} 章 · PDF p.${x.pdf_page} · Fig ${esc(x.figures)}</div>
${x.netlist?`<div class="res">✔ ${esc(x.sim_result)}</div>`:''}
<button class="more" data-open="${x.id}">${x.netlist?'看 netlist・連接圖・模擬結果 ›':'詳細 ›'}</button>
<div class="idea"><b>點子</b>　${esc(x.idea)}</div></article>`).join('');
}
$('grid').addEventListener('click',e=>{
 const b=e.target.closest('.star');
 if(b){const id=+b.dataset.id;favs.has(id)?favs.delete(id):favs.add(id);save();render();return}
 const c=e.target.closest('[data-open]');if(c)openC(+c.dataset.open)});
['q','lv','tp','sp','tw'].forEach(i=>$(i).addEventListener('input',render));
['fav','nl'].forEach(i=>$(i).onclick=function(){this.setAttribute('aria-pressed',String(!pressed(i)));render()});

/* ---------- 詳細視窗 ---------- */
const COL=['var(--accent)','#2f7fb8','#7a8f2a'];
function nice(v){const e=Math.floor(Math.log10(v)),f=v/10**e;return (f<1.5?1:f<3?2:f<7?5:10)*10**e}
function fmt(v,log){const a=Math.abs(v);if(log&&a>=1e6)return +(v/1e6).toPrecision(3)+'M';if(log&&a>=1e3)return +(v/1e3).toPrecision(3)+'k';if(a!==0&&(a<1e-3||a>=1e6))return v.toExponential(1);return String(+v.toPrecision(4))}
function chart(p,ci){
 const W=640,H=300,L=58,R=14,T=10,B=44,S=p.series;
 const lg=p.xlog;let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
 S.forEach(s=>{s.x.forEach(v=>{if(v<x0)x0=v;if(v>x1)x1=v});s.y.forEach(v=>{if(v<y0)y0=v;if(v>y1)y1=v})});
 if(y0===y1){y0-=1;y1+=1}
 const yp=(y1-y0)*.06;y0-=yp;y1+=yp;
 const fx=lg?(v=>Math.log10(v)):(v=>v);const a=fx(x0),b=fx(x1)||1;
 const X=v=>L+(fx(v)-a)/((b-a)||1)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
 let g='',xt=[],yt=[];
 if(lg){for(let k=Math.ceil(a-1e-9);k<=Math.floor(b+1e-9);k++)xt.push(10**k)}
 else{const st=nice((x1-x0)/6);for(let v=Math.ceil(x0/st)*st;v<=x1+st*1e-6;v+=st)xt.push(+v.toPrecision(12))}
 {const st=nice((y1-y0)/5);for(let v=Math.ceil(y0/st)*st;v<=y1;v+=st)yt.push(+v.toPrecision(12))}
 xt.forEach(v=>{const x=X(v);g+=`<line class="gd" x1="${x}" x2="${x}" y1="${T}" y2="${H-B}"/><text x="${x}" y="${H-B+15}" text-anchor="middle">${fmt(v,lg)}</text>`});
 yt.forEach(v=>{const y=Y(v);g+=`<line class="gd" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`});
 g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/>`;
 g+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle">${esc(p.xl)}</text><text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">${esc(p.yl)}</text>`;
 const clip=`c${ci}`;
 g+=`<clipPath id="${clip}"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath>`;
 S.forEach((s,i)=>{g+=`<path class="ln" clip-path="url(#${clip})" stroke="${COL[i%3]}" d="${s.x.map((v,k)=>(k?'L':'M')+X(v).toFixed(1)+' '+Y(s.y[k]).toFixed(1)).join('')}"/>`});
 const leg=p.kind==='xy'||S.length<2?'':`<div class="lg">${S.map((s,i)=>`<span><i style="background:${COL[i%3]}"></i>${esc(s.name)}</span>`).join('')}</div>`;
 return `<div class="chart" data-ci="${ci}"><h4>${esc(p.title)}</h4>${leg}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.title)}">${g}</svg><div class="rd">指到圖上看數值</div></div>`;
}
function hookCharts(root,plots){
 root.querySelectorAll('.chart').forEach(el=>{const p=plots[+el.dataset.ci],svg=el.querySelector('svg'),rd=el.querySelector('.rd');
  svg.addEventListener('pointermove',ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*640;
   const lg=p.xlog,fx=lg?Math.log10:(v=>v);let x0=Infinity,x1=-Infinity;p.series.forEach(s=>{x0=Math.min(x0,s.x[0],s.x[s.x.length-1]);x1=Math.max(x1,s.x[0],s.x[s.x.length-1])});
   if(p.kind==='xy'){return}
   const a=fx(x0),b=fx(x1),t=a+(px-58)/(640-58-14)*(b-a),xv=lg?10**t:t;
   const out=p.series.map(s=>{let bi=0,bd=Infinity;for(let k=0;k<s.x.length;k++){const d=Math.abs(s.x[k]-xv);if(d<bd){bd=d;bi=k}}return `${s.name} ${fmt(s.y[bi])}`}).join('　');
   rd.textContent=`${p.xl.split(' ')[0]} ≈ ${fmt(xv,lg)}　${out}`});
  svg.addEventListener('pointerleave',()=>{rd.textContent='指到圖上看數值'})});
}
let cur=null,curTab='';
function tabsFor(x){const t=[['info','總覽']];if(x.netlist){t.push(['sim','模擬結果']);if(x.schem)t.push(['schem','電路圖']);if(x.graph)t.push(['graph','連接圖（自動）']);t.push(['net','Netlist／Testbench'])}return t}
function showTab(t){
 const x=cur;curTab=t;
 [...$('tabs').children].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));
 const db=$('db');
 if(t==='info'){
  db.innerHTML=`<p style="margin:0">${esc(x.description)}</p>${x.note?`<p class="note">${esc(x.note)}</p>`:''}
  <dl class="kv"><dt>類型</dt><dd>${x.type}・${x.category}・${x.level}</dd><dt>SPICE</dt><dd>${x.spice}</dd><dt>台灣取得</dt><dd>${x.tw_sourcing}</dd><dt>出處</dt><dd class="src">第 ${x.chapter} 章 · PDF p.${x.pdf_page} · Fig ${esc(x.figures)}</dd></dl>
  <div class="idea" style="margin:0"><b>點子</b>　${esc(x.idea)}</div>
  ${x.netlist?`<div class="res">✔ ${esc(x.sim_result)}</div>`:'<p class="note">這一筆還沒有 netlist。</p>'}`}
 else if(t==='sim'){
  db.innerHTML=`<div class="res">✔ ${esc(x.sim_result)}</div>`+(x.plots?x.plots.map((p,i)=>chart(p,i)).join(''):'<p class="note">沒有波形資料。</p>')+`<p class="cap">波形由 ngspice 42 以此 netlist 實際跑出（為了好讀已抽稀取點），元件值若不是取自書中圖，見 netlist 檔頭說明。</p>`;
  if(x.plots)hookCharts(db,x.plots)}
 else if(t==='schem'){
  db.innerHTML=`<div class="schbox">${x.schem}</div><p class="cap">標準符號的電路圖，由我依 netlist 手工排版；元件名稱與數值對照 netlist（已用程式檢查）。${x.schem_note?esc(x.schem_note):''}</p>`}
 else if(t==='graph'){
  db.innerHTML=x.graph+`<p class="cap">這是從 netlist 自動畫出的<b>連接圖</b>（給對照用，標準電路圖請看「電路圖」分頁）：方框是元件、圓點是節點、地線符號代表接地、紅字是接腳（C/B/E＝集極/基極/射極，A/K＝陽極/陰極）、虛線是行為源（B）引用的控制節點。位置為自動排版，不代表實際佈線；子電路（X）只畫成一個方框。</p>`}
 else{
  const blk=(ttl,path,txt,id)=>`<div class="row"><b>${ttl}</b><span class="cap">${esc(path)}</span><button class="chip" data-cp="${id}">複製</button></div><pre style="max-height:none">${esc(txt)}</pre>`;
  db.innerHTML=blk('電路 circuit.cir（純電路）',x.netlist,x.netlist_text,'n')+blk('測試平台 tb.cir（激勵、負載、分析與量測）',x.testbench,x.tb_text,'t')+`<p class="cap">兩個檔放同一資料夾，執行 <code>ngspice -b tb.cir</code>；tb.cir 以 <code>.include circuit.cir</code> 引入電路本體。</p>`;
  db.querySelectorAll('[data-cp]').forEach(b=>b.onclick=function(){const tx=this.dataset.cp==='n'?x.netlist_text:x.tb_text;try{navigator.clipboard.writeText(tx).then(()=>this.textContent='已複製',()=>{this.textContent='複製失敗，請手動選取'})}catch(_){this.textContent='複製失敗，請手動選取'}})}
 db.scrollTop=0}
function openC(id,tab){
 cur=D.find(d=>d.id===id);if(!cur)return;
 $('dt').textContent=cur.name;
 $('tabs').innerHTML=tabsFor(cur).map(([k,l])=>`<button class="tab" role="tab" data-t="${k}">${l}</button>`).join('');
 const dl=$('dlg');if(!dl.open){try{dl.showModal()}catch(_){dl.setAttribute('open','')}}
 showTab(tab||(cur.netlist?'sim':'info'));
 try{history.replaceState(null,'','#c'+id)}catch(_){}}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)showTab(b.dataset.t)});
function closeC(){const dl=$('dlg');if(dl.open)dl.close();try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}}
$('dx').onclick=closeC;
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeC()});
$('dlg').addEventListener('close',()=>{try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(_){}});
chips();render();
{const m=/^#c(\d+)$/.exec(location.hash);if(m)openC(+m[1])}
</script>
</body></html>
